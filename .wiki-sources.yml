# .wiki-sources.yml — LLM 위키(neureps/llm-wiki)가 이 리포에서 읽을 문서 선언. 소유: 이 리포.
# 문서(*.md)를 추가·이동·개명·삭제·archive 하는 커밋에서 같이 확인·갱신한다(규칙: CLAUDE.md).
# 우선순위: exclude > evidence > canonical. glob은 리포 루트 기준, `**`는 하위 전체.
version: 1
canonical:   # 현재 상태·계약 — 위키가 사실로 컴파일
  - "**/*.md"
evidence: []    # 경위·이력·실행 기록 — 근거로만 인용, 현재 상태로 쓰지 않음
exclude:     # 읽지 않음
  - "**/archive/**"
  - "**/node_modules/**"
  - "**/vendor/**"
  - "**/Pods/**"
  - "**/build/**"
  - "**/.venv/**"
  - "**/third_party/**"
